<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#003366">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solicitud de aceite">
<title>Solicitud de análisis para aceites</title>
<style>
:root{--bg:#e9edf2;--fg:#1c2733;--pn:#fff;--bd:#c9d3df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--fg:#e6edf5;--pn:#19222c;--bd:#33414f;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px Calibri,Arial,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--pn)}
button,select,input[type=date]{font:inherit}
button{background:var(--pn);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px 11px;cursor:pointer}
button.p{background:#003366;color:#fff;border-color:#003366}
#bar{position:sticky;top:env(safe-area-inset-top,0px);margin:0 -16px;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--bd)}
#bar b.tl{margin-right:auto}
#pick{max-width:794px;margin:10px auto 0;background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
#pick label{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#pick select{padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--pn);color:var(--fg);max-width:100%}
#msg{max-width:794px;margin:6px auto 0;min-height:18px;font-size:13px}
#wrap{width:100%;max-width:794px;margin:8px auto}
/* Hoja: mide como A4 (794 px) y usa la tipografía del original (Arial 10 pt = 13.33 px) */
.pg{background:#fff;color:#000;width:100%;box-sizing:border-box;padding:28px 6% 36px;box-shadow:0 1px 6px #0003;font:13.33px/1.3 Arial,Helvetica,sans-serif}
.hd{display:flex;align-items:center;gap:0;margin:0 0 22px}
.hd .lg{width:150px;flex:none;display:flex;flex-direction:column;gap:6px;margin-left:5%}.hd .lg img{width:150px;display:block}
.hd .tt{flex:1;text-align:center;font-weight:700;font-size:17.3px;line-height:1.15}
.gb{background:#d9d9d9;height:15px;margin:0 0 12px}
.sol{display:flex;justify-content:space-between;gap:10px;font-weight:700;margin:0 0 12px;flex-wrap:wrap}
.sol label{display:flex;align-items:center;gap:4px}
.f{display:flex;align-items:baseline;gap:5px;min-height:1.7em}.f>span{white-space:nowrap}
.f input,.f textarea{flex:1;min-width:0;border:0;border-bottom:1px dotted #9aa7b5;background:transparent;font:inherit;color:#000;padding:1px 2px;outline:0;border-radius:0}
.f input:focus,.f textarea:focus,.sol input:focus{background:#fffbe6}
.sol input{border:0;border-bottom:1px dotted #9aa7b5;background:transparent;font:inherit;font-weight:700;color:#000;outline:0;width:80px}
.sol input[type=date]{width:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.tb{border:1px solid #000;margin:10px 0 0}
.tb .h{font-weight:700;text-align:center;border-bottom:1px solid #000;padding:2px 0}
.tb .r{display:grid;grid-template-columns:1fr 1fr}.tb .r>div{padding:1px 6px;border-bottom:1px solid #000}.tb .r>div:nth-child(2n){border-left:1px solid #000}
.tb .r:last-child>div{border-bottom:0}
.en{display:grid;grid-template-columns:1.1fr .9fr 1fr;align-items:center}
.en>div{padding:1px 6px;min-height:1.6em;display:flex;align-items:center;justify-content:center}.en>div:nth-child(3n+1){justify-content:flex-start}
.en .hh{font-weight:700}
.en input.o{width:100%;border:0;border-bottom:1px dotted #9aa7b5;background:transparent;font:inherit;text-align:center;outline:0;color:#000}
.en input.ol{width:100%;border:0;border-bottom:1px dotted #9aa7b5;background:transparent;font:inherit;outline:0;color:#000}
.xk{border:1px solid transparent;background:transparent;color:#000;min-width:34px;min-height:1.6em;padding:0 8px;border-radius:4px;font:inherit}
.xk.on{border-color:transparent}.xk:not(.on){border:1px dashed #c4cdd8}
.ur{display:grid;grid-template-columns:1fr 1fr 1fr}.ur>div{padding:2px 6px;border-top:1px solid #000;min-height:1.7em;display:flex;gap:6px;align-items:center;cursor:pointer}.ur>div+div{border-left:1px solid #000}
.ur input{flex:1;min-width:0;border:0;border-bottom:1px dotted #9aa7b5;background:transparent;font:inherit;outline:0;color:#000}
.tb.ob{padding:2px 6px 4px}.ob textarea{width:100%;box-sizing:border-box;min-height:3.9em;border:0;background:transparent;font:inherit;color:#000;outline:0;resize:vertical;display:block}
.ob textarea:focus{background:#fffbe6}
.fm{display:grid;grid-template-columns:240px 1fr;border:1px solid #000;margin:10px 0 0;min-height:54px}.fm>div{padding:8px 6px;display:flex;align-items:center}.fm>div+div{border-left:1px solid #000}
.fm input{width:100%;border:0;background:transparent;font:inherit;font-size:12px;color:#000;outline:0}
.ft{text-align:center;font-size:12px;margin-top:22px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px}.chips button{padding:1px 8px;font-size:12px}.chips button.on{background:#cfe2f3;border-color:#7a9cc0;color:#003366}
.w{color:#b00020;font-size:12px}
@media(max-width:640px){.pg{font-size:15px}.g2{grid-template-columns:1fr}.f input,.f textarea,.sol input,.ob textarea,.fm input,.ur input,.en input{font-size:16px}.fm{grid-template-columns:1fr}.fm>div+div{border-left:0;border-top:1px solid #000}.hd .tt{font-size:14px}.hd .lg,.hd .lg img{width:100px}.tb .r{grid-template-columns:1fr}.tb .r>div:nth-child(2n){border-left:0}.en{grid-template-columns:1.2fr .9fr .7fr}.ur{grid-template-columns:1fr}.ur>div+div{border-left:0}button{padding:8px 12px}}
</style></head><body>
<div id="bar"><b class="tl">Solicitud de análisis para aceites</b><button class="p" id="bd">⬇ Word (.docx)</button><button class="p" id="bp">⬇ PDF</button><button id="bn">Nueva / limpiar</button></div>
<div id="pick"></div><div id="msg"></div><div id="wrap"></div>
