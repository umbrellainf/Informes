<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#003366">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Informe diario">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="iconos/icon-180.png"><link rel="icon" href="iconos/icon-192.png">
<title>Informe de trabajo diario</title>
<style>
:root{--bg:#e9edf2;--fg:#1c2733;--pn:#fff;--bd:#c9d3df;--nv:#003366;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--fg:#e6edf5;--pn:#19222c;--bd:#33414f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161d;--fg:#e6edf5;--pn:#19222c;--bd:#33414f;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:14px Calibri,Arial,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--pn)}
button{background:var(--pn);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit}
button:disabled{opacity:.4;cursor:default}
button.p{background:#003366;color:#fff;border-color:#003366}
#bar{position:sticky;top:env(safe-area-inset-top,0px);margin:0 -16px;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--bd)}
#bar b.tl{margin-right:auto}
.grp{display:inline-flex;gap:2px}
.grp button{min-width:34px;padding:5px 8px}
#fmt button.on{background:#cfe2f3;color:#003366;border-color:#7a9cc0}
#msg{padding:4px 0;min-height:18px;font-size:13px}
#wrap{width:100%;max-width:794px;margin:8px auto}
.pg{background:#fff;color:#333;width:100%;box-sizing:border-box;padding:14px clamp(10px,4vw,53px) 30px;margin:0 0 14px;box-shadow:0 1px 6px #0003;font:11.3px Calibri,Arial,sans-serif}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.hd img{height:36px}.hd span{font-style:italic;font-size:10.7px;color:#a6a6a6}
.ttl{display:block;width:100%;box-sizing:border-box;text-align:center;font:700 17px Calibri,Arial;color:#003366;border:0;background:transparent;margin:6px 0 8px}
h3{font:700 12.7px Calibri,Arial;color:#003366;margin:11px 0 5px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #b0c4de;padding:2px 5px;vertical-align:middle;text-align:left}
th.h,.hh{background:#003366;color:#fff;font-weight:700}
.info th{background:#f0f4f8;color:#003366;width:50%}
.g tr:nth-child(odd) td{background:#f9fafb}.g tr:nth-child(1) td{background:transparent}
.n{width:40px;text-align:center}.x{width:26px;text-align:center;padding:0}
input.c{width:100%;box-sizing:border-box;border:0;background:transparent;font:inherit;color:#333;outline:0;padding:0;display:block}
.ed{width:100%;box-sizing:border-box;min-height:1.25em;color:#333;outline:0;white-space:pre-wrap;word-break:break-word;cursor:text}
.ed:focus,input.c:focus,.ttl:focus{background:#fffbe6}
.sb{background:#cfe2f3;color:#003366;font-weight:700}
.bl{display:flex;gap:6px;border:0}.bl:before{content:"•"}.bl .ed{flex:1}
.add{margin:4px 0 0;font-size:11px;padding:2px 8px}.xb{border:0;background:transparent;color:#b00020;padding:0 4px}
.gr{display:grid;grid-template-columns:1fr 1fr}.sl{border:1px solid #b0c4de}
.im{position:relative;width:100%;overflow:hidden;background:#fff}
.bx{position:absolute;overflow:hidden;display:flex;align-items:center;justify-content:center}.bx.zm{touch-action:none;cursor:grab}
.bx img{position:absolute;max-width:none;max-height:none;transform-origin:50% 50%;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}.ph{color:#9aa7b5}
.sl.w2{grid-column:1/-1}
.bt{position:absolute;top:4px;right:4px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;max-width:calc(100% - 8px);z-index:2}
.bt button{padding:2px 6px;font-size:12px}
input.cp{background:#cfe2f3;color:#003366;text-align:center;height:20px;border:0;border-top:1px solid #b0c4de;width:100%;box-sizing:border-box;font:inherit}
.cap .ui{display:none!important}
table.tt td.eqc{background:#cfe2f3;color:#003366;text-align:center;font-weight:700;width:64px;vertical-align:top}
table.tt .eb{width:64px}table.tt th.eh{width:64px;text-align:center}table.tt .dsh{text-align:center}
.eb2 button{margin:2px 1px 0;padding:0 7px;font-size:12px}
.fh{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
select.cm{font:inherit;font-size:11px;font-weight:400;padding:2px 4px;border:1px solid #b0c4de;border-radius:6px;background:#fff;color:#003366}
@media(max-width:640px){
table.tt,table.tt tbody{display:block;width:100%}
table.tt tr:first-child{display:none}
table.tt tr{display:flex;flex-wrap:wrap;align-items:center;border:1px solid #b0c4de;margin:0 0 8px;padding:4px;gap:4px}
table.tt td{border:0!important;padding:0!important;background:transparent!important;width:auto;box-sizing:border-box}
table.tt td:empty,table.tt td.eb,table.tt td.nd,table.tt td.dsh{display:none}
table.tt td.eqc{flex:0 0 100%;text-align:left;padding:4px 8px!important;background:#cfe2f3!important;display:flex;gap:10px;align-items:center;order:0}
.eb2 button{padding:3px 12px;font-size:16px;margin:0 4px 0 0}
table.tt td.n{flex:0 0 26px;text-align:center;font-weight:700;order:1}
table.tt td:nth-child(3){flex:1 1 0;min-width:0;order:2}
table.tt td:nth-child(5){flex:0 0 32px;order:3}
table.tt td:nth-child(4){flex:0 0 100%;order:4}
table.tt td:nth-child(4)::before{content:'Observaciones';display:block;font-size:11px;color:#667}
}
@media(max-width:640px){.pg{font-size:14px}.ed,input.c,input.cp,.ttl,select.cm{font-size:16px}.gr{grid-template-columns:1fr}.bt button{padding:6px 9px;font-size:14px}.ttl{font-size:17px}.info th{width:36%}.hd img{height:28px}.hd span{font-size:9px}button{padding:8px 12px}.add{padding:6px 10px;font-size:13px}.xb{font-size:18px;padding:0 8px}.x{width:34px}.n{width:30px}#bar b.tl{flex-basis:100%}}
@media print{#bar,#msg,.ui{display:none!important}}

.lgw{display:flex;align-items:center;gap:8px}.hd img{max-width:150px;object-fit:contain}.lgb button{font-size:11px;padding:1px 6px;margin-left:4px}
.lgph{border:1px dashed #7a8ea3;background:transparent;color:#5b6f85;padding:8px 14px}
.hdt{border:0;background:transparent;font:italic 10.7px Calibri,Arial,sans-serif;color:#7d7d7d;text-align:right;width:45%;outline:0}
table.tt input.en{width:100%;box-sizing:border-box;border:0;background:transparent;font:inherit;font-weight:700;color:#003366;text-align:center;padding:0;outline:0;min-width:0}
table.tt td.eqc{width:78px}
@media(max-width:640px){table.tt td.eqc input.en{text-align:left;font-size:16px;width:auto;flex:1}}
.bt select.cs{background:var(--pn);color:var(--fg);border:1px solid var(--bd);border-radius:6px;font:inherit;font-size:12px;padding:3px 4px;max-width:140px;cursor:pointer}
</style></head><body>
<div id="bar"><b class="tl">Informe de trabajo diario</b>
<span class="grp" id="fmt" title="Formato del texto seleccionado"><button data-fm="bold" title="Negrita (Ctrl+B)"><b>N</b></button><button data-fm="italic" title="Cursiva (Ctrl+I)"><i>K</i></button><button data-fm="underline" title="Subrayado (Ctrl+U)"><u>S</u></button></span>
<span class="grp"><button id="bu" title="Deshacer (Ctrl+Z)" disabled>↶</button><button id="br" title="Rehacer (Ctrl+Y)" disabled>↷</button></span>
<button class="p" id="bd">⬇ Word (.docx)</button><button class="p" id="bp">⬇ PDF</button><button id="bn">Nuevo / limpiar</button><button id="bi" title="Abrir un informe ya hecho (Word, PDF o Excel) para seguir completándolo">⬆ Abrir informe</button></div>

<div id="wrap"></div>

const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function pushRun(out,t,st){if(!t)return;const l=out[out.length-1];if(l&&!!l.b==!!st.b&&!!l.i==!!st.i&&!!l.u==!!st.u)l.t+=t;else out.push({t,b:!!st.b,i:!!st.i,u:!!st.u})}
function walkRuns(n,st,out){for(const c of n.childNodes){
 if(c.nodeType==3){pushRun(out,c.nodeValue.replace(/ /g,' ').replace(/\r/g,''),st);continue}
 if(c.nodeType!=1)continue;const tg=c.tagName.toUpperCase();
 if(tg=='BR'){pushRun(out,'\n',st);continue}
 if(/^(SCRIPT|STYLE|TEMPLATE)$/.test(tg))continue;
 const s={...st};if(/^(B|STRONG)$/.test(tg))s.b=1;if(/^(I|EM)$/.test(tg))s.i=1;if(tg=='U'||tg=='INS')s.u=1;
 const cs=c.style;if(cs){const fw=cs.fontWeight;if(fw=='bold'||fw=='bolder'||+fw>=600)s.b=1;else if(fw=='normal'||(+fw&&+fw<600))s.b=0;
  if(cs.fontStyle=='italic'||cs.fontStyle=='oblique')s.i=1;else if(cs.fontStyle=='normal')s.i=0;
  if(/underline/.test((cs.textDecorationLine||'')+' '+(cs.textDecoration||'')))s.u=1}
 const blk=/^(DIV|P|LI|H[1-6])$/.test(tg);
 if(blk&&out.length&&!out[out.length-1].t.endsWith('\n'))pushRun(out,'\n',st);
 walkRuns(c,s,out)}return out}
const runs=h=>{const d=document.createElement('template');d.innerHTML=String(h??'');return walkRuns(d.content,{},[])};
function ser(rs){rs=rs.map(r=>({...r}));while(rs.length){const l=rs[rs.length-1];l.t=l.t.replace(/[\n ]+$/,m=>m.replace(/\n/g,''));if(l.t)break;rs.pop()}
 return rs.map(r=>{let h=esc(r.t).replace(/\n/g,'<br>');if(r.u)h=`<u>${h}</u>`;if(r.i)h=`<i>${h}</i>`;if(r.b)h=`<b>${h}</b>`;return h}).join('')}

 (o.gen||[]).forEach(p2);(o.eq||[]).forEach(q=>(q&&q.r||[]).forEach(p2));

 ['tareas','eqt','to','asunto','auto','cuerpo','aD','aP'].forEach(k=>delete S[k]);
 if(!['te','t','e'].includes(S.capMode))S.capMode='te';
 ['fotos','ats'].forEach(k=>S[k].forEach(f=>{if(f.auto==null)f.auto=0;if(f.cap==null)f.cap='';if(f.rot==null)f.rot=0;if(!(f.z>=1))f.z=1;if(f.px==null)f.px=0;if(f.py==null)f.py=0}));

// Planilla de cálculo: filas -> bloques (fila con un solo texto que es título/sección = párrafo; el resto, tablas)
function rowsToBlocks(rows){const out=[];let tb=null,seen=0;
 const close=()=>{if(!tb)return;const used=new Set();tb.forEach(r=>r.forEach((v,j)=>{if(String(v).trim())used.add(j)}));const cols=[...used].sort((a,b)=>a-b);
  out.push({rows:tb.map(r=>cols.map(j=>{const t=String(r[j]??'').trim(),ps=t.split('\n');return{t,ps,ph:ps.map(fromPlain),h:fromPlain(t),b:[]}}))});tb=null};
 for(const r of rows){const ne=r.filter(v=>String(v??'').trim());if(!ne.length)continue;const k=nz(ne[0]);
  if(ne.length==1&&(/^[1-6]\s*[.)\-]\s*[A-Z]/.test(k)||(k.startsWith('ANEXO')&&k.includes('ATS'))||!seen)){close();out.push({p:String(ne[0])});seen=1;continue}
  seen=1;(tb=tb||[]).push(r)}
 close();return out}
async function readXlsx(buf){const z=await unzip(buf),wb=await z.text('xl/workbook.xml');if(!wb)throw new Error('El archivo no es un Excel (.xlsx) válido.');
 const sh=xml(wb).getElementsByTagNameNS('*','sheet')[0],wr=await rels(z,'xl/workbook.xml'),r=sh&&wr[sh.getAttributeNS(R_NS,'id')];if(!r)throw new Error('La planilla no tiene hojas.');
 const ss=await z.text('xl/sharedStrings.xml'),SS=ss?[...xml(ss).getElementsByTagNameNS('*','si')].map(si=>[...si.getElementsByTagNameNS('*','t')].map(t=>t.textContent).join('')):[];
 const rows=[];for(const row of xml(await z.text(r.t)).getElementsByTagNameNS('*','row')){const a=[];
  for(const c of kidsL(row,'c')){const ref=c.getAttribute('r')||'',col=[...ref.replace(/\d+/g,'')].reduce((n,ch)=>n*26+ch.charCodeAt(0)-64,0)-1,ty=c.getAttribute('t'),v=kidsL(c,'v')[0];
   let t=ty=='s'?SS[+(v&&v.textContent)]:ty=='inlineStr'?txt(c):(v?v.textContent:'');a[col<0?a.length:col]=t??''}
  rows[(+row.getAttribute('r')||rows.length+1)-1]=a}
 return parseBlocks(rowsToBlocks(rows.filter(Boolean)),async()=>null)}
function readCsv(text){const rows=[];let r=[],f='',q=0;const sep=(text.split('\n')[0].match(/;/g)||[]).length>(text.split('\n')[0].match(/,/g)||[]).length?';':',';
 for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch=='"'&&text[i+1]=='"'){f+='"';i++}else if(ch=='"')q=0;else f+=ch}
  else if(ch=='"')q=1;else if(ch==sep){r.push(f);f=''}else if(ch=='\n'){r.push(f.replace(/\r$/,''));rows.push(r);r=[];f=''}else f+=ch}
 r.push(f);rows.push(r);return parseBlocks(rowsToBlocks(rows),async()=>null)}

 const v=doc.getInfoDict().lookup(PDFName.of(PKEY));if(!v)throw new Error('Este PDF no fue generado por la planilla (o es de una versión anterior). Para importarlo usá el Word (.docx).');
