<style>

}

</style></head><body>

<script>

function norm(){if(!Array.isArray(S.gen)||!S.gen.length)S.gen=[['','']];if(!Array.isArray(S.eq)||!S.eq.length)S.eq=DEF().eq;S.eq.forEach(q=>{if(!Array.isArray(q.r))q.r=[];if(typeof q.n!='string')q.n=''});delete S.tareas;delete S.eqt;
['temas','part','dif','sug','seg'].forEach(k=>{while(S[k].length>5&&!S[k][S[k].length-1])S[k].pop();while(S[k].length<5&&!S[k].some(x=>x))S[k].push('')})}

const slot=(k,i)=>{const f=S[k][i];return `<div class="sl${k=='ats'?' big':''}"><div class="im">${f.src?`<img src="${f.src}">`:'<span class="ph">Sin imagen</span>'}<div class="ui bt"><button data-up="${k}.${i}">${f.src?'Reemplazar':'Cargar'}</button>${f.src?`<button data-rm="${k}.${i}">Eliminar</button>`:''}</div></div><input class="cp" data-p="${k}.${i}.cap" value="${esc(f.cap)}" placeholder="Epígrafe"></div>`};

function tareasT(){let n=0;
 const bt=k=>`<span class="ui eb2"><button data-add="${k}">+</button><button data-sub="${k}">−</button></span>`;
 const row=(c0,k,r,i)=>`<tr>${c0}<td class="n">${++n}</td><td>${ta(k+'.'+i+'.0',r[0])}</td><td>${ta(k+'.'+i+'.1',r[1])}</td>${delB(k,i)}</tr>`;
 let h='';
  S.gen.forEach((r,i)=>{h+=row(`<td class="eb">${i==0?bt('gen'):''}</td>`,'gen',r,i)});
  S.eq.forEach((q,qi)=>{const k='eq.'+qi+'.r',nm=`<input class="en" data-p="eq.${qi}.n" value="${esc(q.n)}" placeholder="Equipo ${qi+1}">`;
   if(!q.r.length)h+=`<tr><td class="eqc">${nm}${bt(k)}</td><td class="n nd">–</td><td class="dsh">–</td><td class="dsh">–</td><td class="ui x"></td></tr>`;
   else q.r.forEach((r,i)=>{h+=row(i==0?`<td class="eqc">${nm}${bt(k)}</td>`:'<td class="eb"></td>',k,r,i)})});
  return `<table class="g tt"><tr><th class="h eh">EQUIPO</th><th class="h n">#</th><th class="h">TAREAS</th><th class="h">OBSERVACIONES</th><th class="h ui x"></th></tr>${h}</table><button class="ui add" data-addeq="1">+ Agregar equipo</button> <button class="ui add" data-subeq="1">− Quitar equipo</button>`}
function R(){
$('#wrap').innerHTML=`<section class="pg">${HDR(1)}<input class="ttl" data-p="titulo" value="${esc(S.titulo)}">
<table class="info">${[['FECHA','fecha'],['EQUIPO','equipo'],['PROYECTO','proyecto'],['CONTRATISTA','contratista'],['JT (Jefe de Trabajo)','jt']].map(([l,k])=>`<tr><th>${l}</th><td><input class="c" data-p="${k}" value="${esc(S[k])}"></td></tr>`).join('')}</table>
<h3>1. ACTIVIDADES PROGRAMADAS</h3>${tareasT()}
<h3>2. REGISTRO DE CHARLA PRE TAREA</h3><table>${bulT('temas','TEMAS TRATADOS')}${bulT('part','PARTICIPANTES')}</table>
<h3>3. DIFICULTADES DE LA JORNADA</h3>${numT('dif','DIFICULTADES ENCONTRADAS')}
<h3>4. SUGERENCIAS / OPORTUNIDADES DE MEJORA / CONSIDERACIONES PARA TAREAS PRÓXIMAS</h3>${numT('sug','DESCRIPCIÓN')}
<h3>5. SEGURIDAD</h3>${numT('seg','DESCRIPCIÓN')}</section>${fotoPg(0)}${fotoPg(1)}
<section class="pg" data-ats="1">${HDR(0)}<h3>ANEXO REGISTRO DEL ATS</h3><div class="gr">${slot('ats',0)}${slot('ats',1)}</div></section>`;
document.querySelectorAll('textarea').forEach(fit)}
document.addEventListener('input',e=>{const t=e.target,p=t.dataset.p;if(!p)return;set(p,t.value);if(t.tagName=='TEXTAREA')fit(t);persist()});

$('#fi').onchange=async e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length)return;try{
 if(tg){Object.assign(get(tg),await proc(fs[0],tg.startsWith('ats')?2000:1600))}
 else for(const f of fs){const i=S.fotos.findIndex(x=>!x.src);if(i<0){msg('No hay lugares libres: máximo 12 fotos.');break}Object.assign(S.fotos[i],await proc(f,1600))}
 }catch(x){msg('No se pudo leer la imagen.')}R();persist()};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset;
 if(a.lg){$('#lf').click()}else if(a.lgrm){S.logo=null;R();persist()}else if(a.addeq){if(S.eq.length<12){S.eq.push({n:'',r:[]});R();persist()}}else if(a.subeq){if(S.eq.length>1){S.eq.pop();R();persist()}}else if(a.add){const L=get(a.add);L.push(a.add=='gen'||isEq(a.add)?['','']:'');R();persist()}
 else if(a.sub){const L=get(a.sub);if(L.length>(isEq(a.sub)?0:1)){L.pop();R();persist()}}
 else if(a.del){const j=a.del.lastIndexOf('.'),k=a.del.slice(0,j),i=a.del.slice(j+1),L=get(k);if(L.length>(isEq(k)?0:1)){L.splice(+i,1);R();persist()}}
 else if(a.up){tg=a.up;$('#fi').multiple=false;$('#fi').click()}
 else if(a.multi){tg=null;$('#fi').multiple=true;$('#fi').click()}
 else if(a.rm){const f=get(a.rm);f.src='';f.w=f.h=0;R();persist()}
 else if(a.rc){}});
const fname=()=>(S.titulo+'_'+(S.fecha||'sin-fecha')).replace(/[^\wÁÉÍÓÚÑáéíóúñ-]+/g,'_');
async function save(name,blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
const u8=d=>Uint8Array.from(atob(d.split(',')[1]),c=>c.charCodeAt(0));
async function mkDocx(){

 const{Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,Header,Footer,WidthType,ShadingType,BorderStyle,AlignmentType,LevelFormat,PageNumber,VerticalAlign,HeightRule,ImageRun}=docx;

 const run=(t,o={})=>new TextRun({text:t,font:F,size:17,color:'333333',...o}),P=(t,o={},po={})=>new Paragraph({spacing:{after:0},children:[run(t,o)],...po}),fl=f=>({type:ShadingType.CLEAR,fill:f,color:'auto'});

 const gc=[5160,5160],CAP=300;

 const lg=S.logo?u8(S.logo.src):null,lr=S.logo?Math.min(150/S.logo.w,38/S.logo.h):1,lgDim=S.logo?{width:Math.round(S.logo.w*lr),height:Math.round(S.logo.h*lr)}:{width:1,height:1},hcs=[3400,W-3400];
 const header=new Header({children:[tb(hcs,[new TableRow({children:[new TableCell({width:{size:hcs[0],type:WidthType.DXA},borders:nb,margins:{top:0,bottom:40,left:0,right:0},children:[new Paragraph({spacing:{after:0},children:lg?[new ImageRun({type:'png',data:lg,transformation:lgDim})]:[]})]}),new TableCell({width:{size:hcs[1],type:WidthType.DXA},borders:nb,verticalAlign:VerticalAlign.CENTER,children:[new Paragraph({alignment:AlignmentType.RIGHT,spacing:{after:0},children:[new TextRun({text:S.hdr||'',font:F,size:16,italics:true,color:'A6A6A6'})]})]})]})])]});
